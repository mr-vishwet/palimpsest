name: palimpsest
description: "PALIMPSEST — your life, as an editable memory. A local-first life archive: ask a question about an old memory and watch it reconstruct the moment."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.47.0'

dependencies:
  flutter:
    sdk: flutter
  # Material Design widgets (package:flutter/material.dart was deprecated in
  # Flutter 3.47; the library moved to the material_ui package).
  material_ui: ^1.11.1
  # Space Grotesk display/body + JetBrains Mono for metadata.
  google_fonts: ^9.0.0
  # The four logo versions are bundled as SVG assets.
  flutter_svg: ^2.0.17
  # Local-first persistence: the whole archive (stories, memories, layers,
  # people, places, voice notes, links, settings, account) is one versioned
  # JSON document in shared_preferences in v0.1. A Drift/SQLite store behind
  # the same ArchiveStore interface is a phase-2 item.
  shared_preferences: ^2.3.4
  # Real file import: multi-select picker for photos and videos.
  file_picker: ^13.4.1
  # EXIF parsing for imported photos (capture date, GPS, orientation).
  exif: ^3.3.0
  # Pure-Dart image decode/resize/encode for import thumbnails.
  image: ^4.13.1
  # Drift/SQLite metadata store behind the ArchiveStore interface.
  drift: ^2.35.4
  # Bundled native SQLite library (VM tests, mobile, desktop).
  sqlite3_flutter_libs: ^0.6.0
  # IndexedDB access for the web blob store.
  idb_shim: ^2.11.3
  # App documents directory for the native blob store and database file.
  path_provider: ^2.1.6
  # --- Worker C (media features): added here so only one worker owns pubspec.
  # Voice-note recording.
  record: ^7.2.0
  # Voice-note playback.
  audioplayers: ^6.8.1
  # Video playback + metadata probing.
  video_player: ^2.14.1
  # Share sheet for exports.
  share_plus: ^13.3.1
  # ZIP encoding for story exports (Worker C).
  archive: ^4.7.1
  # Browser APIs for web-only media paths (Worker C).
  web: ^1.1.2
  # SHA-256 checksums for the provenance contract: every memory links to a
  # source id + checksum, and exports are deterministic.
  crypto: ^3.0.6
  # firstOrNull and other collection helpers used across the codebase.
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Drift code generation (generated files are committed; CI does not
  # run build_runner).
  drift_dev: ^2.35.3
  build_runner: ^2.17.1

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
    - assets/demo/
